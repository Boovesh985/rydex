name: Feature request
description: An idea for Rydex
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who is it for (rider, driver, operations, developer), and what is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should happen instead. Sketches and examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
