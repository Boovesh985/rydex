name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: docker/setup-buildx-action@v4
      - name: Build PostGIS test image (used by Testcontainers)
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          load: true
          tags: ghcr.io/boovesh985/rydex-postgres:16-3
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  simulator:
    name: Simulator (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ai-service:
    name: AI service (pytest, training)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Training runs end to end
        run: python -m training.train --rows 20000 --out /tmp/models

  infra:
    name: Infra (compose + images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose -f infra/docker-compose.yml --profile app --profile city config -q
          # every setting the production file requires, with dummy values
          sed 's/=$/=ci-dummy/' infra/.env.example > "$RUNNER_TEMP/prod.env"
          docker compose -f infra/docker-compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" --profile city config -q
      - name: Validate the Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            sh -c 'caddy fmt /etc/caddy/Caddyfile | diff /etc/caddy/Caddyfile - && caddy validate --config /etc/caddy/Caddyfile'
      - name: Lint shell scripts
        run: shellcheck infra/postgres/initdb/*.sh infra/kafka/*.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build PostGIS image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Boot infra and wait for health
        run: |
          docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 180 postgres redis kafka
          docker compose -f infra/docker-compose.yml run --rm kafka-init
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U rydex -d rydex -tAc "select postgis_version()"
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 100

  images:
    name: Image ${{ matrix.image }} (amd64 + arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ride-service, file: services/Dockerfile, args: "SERVICE=ride-service\nPORT=8081" }
          - { image: driver-service, file: services/Dockerfile, args: "SERVICE=driver-service\nPORT=8082" }
          - { image: tracking-service, file: services/Dockerfile, args: "SERVICE=tracking-service\nPORT=8083" }
          - { image: payment-service, file: services/Dockerfile, args: "SERVICE=payment-service\nPORT=8084" }
          - { image: ai-service, file: ai-service/Dockerfile, args: "" }
          - { image: caddy, file: infra/caddy/Dockerfile, args: "" }
          - { image: simulator, file: simulator/Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for both platforms (not pushed yet; deploy.yml publishes in Phase 10)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  stack:
    name: Full stack in containers (memory limits, Caddy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start every container
        run: |
          docker compose -f infra/docker-compose.yml --profile app build
          docker compose -f infra/docker-compose.yml --profile app up -d --wait --wait-timeout 300
      - name: Smoke test through the containers (the web app's checks go through Caddy)
        shell: pwsh
        run: ./infra/scripts/smoke-test.ps1 -FrontendUrl http://localhost:8080
      - name: Caddy serves the web app with its headers and keeps internal endpoints in
        run: |
          curl -fsS -D - -o /dev/null http://localhost:8080/ | tee headers.txt
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          curl -fsS http://localhost:8080/rides/123 | grep -q '<div id="root">'
          ! curl -fsS http://localhost:8080/actuator/health | grep -q '"status"'
          ! curl -fsS http://localhost:8080/v3/api-docs | grep -q openapi
      - name: Memory under the limits, nothing killed
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}'
          for c in $(docker compose -f infra/docker-compose.yml --profile app ps -q); do
            name=$(docker inspect -f '{{.Name}}' "$c")
            test "$(docker inspect -f '{{.State.OOMKilled}} {{.RestartCount}}' "$c")" = "false 0" || { echo "$name was killed or restarted"; exit 1; }
            user=$(docker inspect -f '{{.Config.User}}' "$c")
            echo "$name runs as ${user:-root}"
          done
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile app logs --tail 120

  e2e:
    name: End-to-end (services + Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: docker/setup-buildx-action@v4
      - name: Build PostGIS image
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          load: true
          tags: ghcr.io/boovesh985/rydex-postgres:16-3
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Boot infra
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180 postgres redis kafka
          docker compose -f infra/docker-compose.yml run --rm kafka-init
      - name: Build services
        run: ./mvnw -B -ntp -DskipTests -Djacoco.skip=true package
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            simulator/requirements.txt
      - name: Start ai-service
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --port 8085 > ../ai.log 2>&1 &
          timeout 60 bash -c "until curl -sf localhost:8085/health > /dev/null; do sleep 1; done"
      - name: Start ride-service, driver-service, tracking-service and payment-service
        run: |
          nohup java -jar services/ride-service/target/ride-service-*.jar > ride.log 2>&1 &
          nohup java -jar services/driver-service/target/driver-service-*.jar > driver.log 2>&1 &
          nohup java -jar services/tracking-service/target/tracking-service-*.jar > tracking.log 2>&1 &
          PAYMENT_PROVIDER=mock nohup java -jar services/payment-service/target/payment-service-*.jar > payment.log 2>&1 &
          for port in 8081 8082 8083 8084; do
            timeout 120 bash -c "until curl -sf localhost:$port/actuator/health > /dev/null; do sleep 2; done"
          done
      - name: Smoke test (phases 0-7, full ride over Kafka and WebSockets, payments, AI suggestions)
        shell: pwsh
        run: ./infra/scripts/smoke-test.ps1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser test (Playwright, a full ride in Chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npx playwright test
      - name: Driver simulator (3 drivers sign in, go online and report positions)
        working-directory: simulator
        run: |
          pip install -r requirements.txt
          timeout --signal=INT 45 python simulate.py --drivers 3 --park > simulator.log 2>&1 || true
          cat simulator.log
          test "$(grep -c ' online at ' simulator.log)" -eq 3
          grep -q 'final: 0 online' simulator.log
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 150 ride.log driver.log tracking.log payment.log ai.log || true
          docker compose -f infra/docker-compose.yml logs --tail 50
