name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: docker/setup-buildx-action@v4
      - name: Build PostGIS test image (used by Testcontainers)
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          load: true
          tags: ghcr.io/boovesh985/rydex-postgres:16-3
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  simulator:
    name: Simulator (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  infra:
    name: Infra (compose + images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config -q
      - name: Lint shell scripts
        run: shellcheck infra/postgres/initdb/*.sh infra/kafka/*.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build PostGIS image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Boot infra and wait for health
        run: |
          docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 180 postgres redis kafka
          docker compose -f infra/docker-compose.yml run --rm kafka-init
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U rydex -d rydex -tAc "select postgis_version()"
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 100

  e2e:
    name: End-to-end (services + Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: docker/setup-buildx-action@v4
      - name: Build PostGIS image
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          load: true
          tags: ghcr.io/boovesh985/rydex-postgres:16-3
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Boot infra
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180 postgres redis kafka
          docker compose -f infra/docker-compose.yml run --rm kafka-init
      - name: Build services
        run: ./mvnw -B -ntp -DskipTests -Djacoco.skip=true package
      - name: Start ride-service, driver-service, tracking-service and payment-service
        run: |
          nohup java -jar services/ride-service/target/ride-service-*.jar > ride.log 2>&1 &
          nohup java -jar services/driver-service/target/driver-service-*.jar > driver.log 2>&1 &
          nohup java -jar services/tracking-service/target/tracking-service-*.jar > tracking.log 2>&1 &
          PAYMENT_PROVIDER=mock nohup java -jar services/payment-service/target/payment-service-*.jar > payment.log 2>&1 &
          for port in 8081 8082 8083 8084; do
            timeout 120 bash -c "until curl -sf localhost:$port/actuator/health > /dev/null; do sleep 2; done"
          done
      - name: Smoke test (phases 0-6, full ride over Kafka and WebSockets, payments)
        shell: pwsh
        run: ./infra/scripts/smoke-test.ps1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser test (Playwright, a full ride in Chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npx playwright test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - name: Driver simulator (3 drivers sign in, go online and report positions)
        working-directory: simulator
        run: |
          pip install -r requirements.txt
          timeout --signal=INT 45 python simulate.py --drivers 3 --park > simulator.log 2>&1 || true
          cat simulator.log
          test "$(grep -c ' online at ' simulator.log)" -eq 3
          grep -q 'final: 0 online' simulator.log
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 150 ride.log driver.log tracking.log payment.log || true
          docker compose -f infra/docker-compose.yml logs --tail 50
