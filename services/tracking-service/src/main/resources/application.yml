server:
  port: ${PORT:8083}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: tracking-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rydex}
    username: ${DB_USER:tracking_svc}
    password: ${DB_PASSWORD:tracking_local_pw}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # each service lives in its own schema (ADR 0004); PostGIS types are in public
      connection-init-sql: SET search_path TO tracking, public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: tracking
    default-schema: tracking
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # driver.location is telemetry: one ack is enough, and a lost update is replaced 3 s later
      acks: 1
      properties:
        enable.idempotence: false
        linger.ms: 5
        max.block.ms: 2000
    consumer:
      group-id: tracking-service
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      concurrency: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # API_DOCS_ENABLED=false hides Swagger UI and the OpenAPI document (e.g. on a public deployment)
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui
    persist-authorization: true
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      osrm-route:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

rydex:
  jwt:
    issuer: ${JWT_ISSUER:rydex}
    # ride-service issues tokens and publishes its public key here (ADR 0006)
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  messaging:
    outbox:
      # tracking-service consumes events and publishes telemetry directly; it has no outbox
      enabled: false
  services:
    ride-service-url: ${RIDE_SERVICE_URL:http://localhost:8081}
    driver-service-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
  presence:
    # same values as driver-service: both write the same Redis keys
    stale-after: 30s
    min-location-interval: 500ms
  tracking:
    # one stored point per driver per interval while on a trip (driver_location_history)
    history-interval: 5s
    # how long an OSRM ETA is reused (counting down) before it is asked again
    eta-refresh: 20s
  routing:
    osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    user-agent: ${GEO_USER_AGENT:Rydex/0.1 (portfolio project; +https://github.com/Boovesh985/rydex)}
    connect-timeout: 2s
    read-timeout: 3s
    fallback-speed-kmh: 22
    road-factor: 1.35
  ws:
    # STOMP heart-beats both ways (master prompt §10)
    heartbeat: 10s
