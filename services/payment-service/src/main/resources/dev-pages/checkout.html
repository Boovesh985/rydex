<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rydex test checkout</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1f; --bg: #f6f6f8; --card: #fff; --muted: #6b6b76; --accent: #111; --ok: #0a7a3d; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececf1; --bg: #121214; --card: #1c1c20; --muted: #9a9aa6; --accent: #ececf1; } }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 520px; margin: 32px auto; padding: 0 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #8884; background: transparent; color: inherit; font: 13px ui-monospace, monospace; }
  textarea { height: 64px; }
  button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Rydex test checkout</h1>
    <p class="note">Development only. Pays a ride's payment with Razorpay test mode: no real money moves.
      In checkout, use UPI ID <b>success@razorpay</b> (or <b>failure@razorpay</b> to see a decline).</p>
    <label for="ride">Ride id</label>
    <input id="ride" autocomplete="off">
    <label for="token">Rider access token (from ride-service login)</label>
    <textarea id="token" autocomplete="off"></textarea>
    <button id="load">Load payment</button>
  </div>
  <div class="card" id="result" hidden>
    <dl id="details"></dl>
    <button id="pay" disabled>Pay with Razorpay</button>
    <pre id="log"></pre>
  </div>
</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  // ride and token can be passed in the URL fragment (never sent to a server): #ride=...&token=...
  const params = new URLSearchParams(location.hash.slice(1));
  const $ = id => document.getElementById(id);
  $('ride').value = params.get('ride') || '';
  $('token').value = params.get('token') || '';
  history.replaceState(null, '', location.pathname);

  let payment = null;

  function log(msg) { $('log').textContent = msg; }
  const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { 'Authorization': 'Bearer ' + $('token').value.trim(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
    return data;
  }

  function show(p) {
    payment = p;
    const cls = p.status === 'SUCCEEDED' || p.status === 'REFUNDED' ? 'ok' : p.status === 'FAILED' ? 'bad' : '';
    const status = `<span class="${cls}">${esc(p.status)}</span>`;
    const rows = [
      ['Status', status], ['For', p.kind === 'RIDE_FARE' ? 'Ride fare' : 'Cancellation fee'],
      ['Amount', 'Rs ' + esc(p.amount)], ['Refunded', 'Rs ' + esc(p.refundedAmount)], ['Provider', esc(p.provider)],
      ['Order', esc(p.providerRef || '-')], ['Problem', esc(p.failureReason || '-')]
    ];
    $('details').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    $('pay').disabled = !p.checkout;
    $('result').hidden = false;
  }

  async function load() {
    try {
      show(await api('GET', '/api/payments/rides/' + encodeURIComponent($('ride').value.trim())));
      log(payment.checkout ? 'Ready to pay.' : 'Nothing to pay here.');
    } catch (e) { $('result').hidden = false; log('Could not load the payment: ' + e.message); }
  }

  $('load').onclick = load;

  $('pay').onclick = () => {
    const c = payment.checkout;
    const rzp = new Razorpay({
      key: c.keyId, order_id: c.orderId, amount: c.amount, currency: c.currency,
      name: c.name, description: c.description,
      handler: async (resp) => {
        log('Paid in checkout; confirming with Rydex...');
        try {
          show(await api('POST', `/api/payments/${payment.id}/razorpay/verify`, {
            razorpayOrderId: resp.razorpay_order_id,
            razorpayPaymentId: resp.razorpay_payment_id,
            razorpaySignature: resp.razorpay_signature
          }));
          log('Confirmed.');
        } catch (e) { log('Confirmation failed: ' + e.message); }
      }
    });
    rzp.on('payment.failed', resp => log('Checkout reported a failure: ' + resp.error.description
      + '. You can try again; Rydex also notices failures on its own.'));
    rzp.open();
  };

  if ($('ride').value && $('token').value) load();
</script>
</body>
</html>
