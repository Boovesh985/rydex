# Local stack. Ports bind to 127.0.0.1 only.
#   docker compose -f infra/docker-compose.yml up -d
#       infra only (Postgres, Redis, Kafka): run the services from your IDE or with mvnw
#   docker compose -f infra/docker-compose.yml --profile app up -d --build
#       the whole stack in containers, under memory limits; the web app on http://localhost:8080
#   add --profile city for the living city (simulated drivers and riders) as well
# The production file (docker-compose.prod.yml) runs the same images from GHCR (ADR 0023).
name: rydex

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 5s
  retries: 10

# app containers: read-only root, no Linux capabilities, no privilege gain, scratch space in memory
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  profiles: [app]

x-spring-env: &spring-env
  DB_HOST: postgres
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # ride-service signs tokens, the others read its public key (ADR 0006)
  JWT_JWK_SET_URI: http://ride-service:8081/.well-known/jwks.json
  # behind Caddy: client IPs (rate limits) and https links come from X-Forwarded-*
  FORWARD_HEADERS_STRATEGY: framework
  CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173

x-spring-deps: &spring-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

x-spring-build: &spring-build
  context: ..
  dockerfile: services/Dockerfile

services:
  postgres:
    build:
      context: ./postgres
    image: ghcr.io/boovesh985/rydex-postgres:16-3
    environment:
      POSTGRES_DB: rydex
      POSTGRES_USER: ${POSTGRES_USER:-rydex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rydex_local_pw}
      RIDE_DB_PASSWORD: ${RIDE_DB_PASSWORD:-ride_local_pw}
      DRIVER_DB_PASSWORD: ${DRIVER_DB_PASSWORD:-driver_local_pw}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD:-tracking_local_pw}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local_pw}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-ai_local_pw}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d rydex"]
    mem_limit: 1g
    # back after a reboot along with the app containers, which need it
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # noeviction: GEO sets, locks and offers must never be silently evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]
    mem_limit: 256m
    # back after a reboot along with the app containers, which need it
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: U10ni5OXT5eHT2PW-vW1EQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: other containers (kafka:29092). EXTERNAL: apps run on the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # one broker with a city's worth of events: 512 MB is plenty (it had a fixed 1 GB)
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      # one combined broker+controller on a busy laptop: a late heartbeat must not fence the broker
      # (it then reloads every partition, burns CPU and misses the next one: NOT_COORDINATOR storms)
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 30000
      KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 3000
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      <<: *hc
      # the CLI is a JVM of its own and would inherit the broker's heap settings every 10 s
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      start_period: 30s
    mem_limit: 1g
    # back after a reboot along with the app containers, which need it
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  ride-service:
    <<: *hardened
    build:
      <<: *spring-build
      args: { SERVICE: ride-service, PORT: "8081" }
    image: ghcr.io/boovesh985/rydex-ride-service:${RYDEX_TAG:-latest}
    depends_on: *spring-deps
    environment:
      <<: *spring-env
      DB_PASSWORD: ${RIDE_DB_PASSWORD:-ride_local_pw}
      AI_BASE_URL: http://ai-service:8085
      # infra/keys from infra/scripts/gen-jwt-keys.sh; without them an ephemeral key (sign-ins end on restart)
      JWT_PRIVATE_KEY_LOCATION: file:/keys/jwt-private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
    volumes:
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 768m

  driver-service:
    <<: *hardened
    build:
      <<: *spring-build
      args: { SERVICE: driver-service, PORT: "8082" }
    image: ghcr.io/boovesh985/rydex-driver-service:${RYDEX_TAG:-latest}
    depends_on: *spring-deps
    environment:
      <<: *spring-env
      DB_PASSWORD: ${DRIVER_DB_PASSWORD:-driver_local_pw}
    ports:
      - "127.0.0.1:8082:8082"
    mem_limit: 768m

  tracking-service:
    <<: *hardened
    build:
      <<: *spring-build
      args: { SERVICE: tracking-service, PORT: "8083" }
    image: ghcr.io/boovesh985/rydex-tracking-service:${RYDEX_TAG:-latest}
    depends_on: *spring-deps
    environment:
      <<: *spring-env
      DB_PASSWORD: ${TRACKING_DB_PASSWORD:-tracking_local_pw}
      RIDE_SERVICE_URL: http://ride-service:8081
      DRIVER_SERVICE_URL: http://driver-service:8082
    ports:
      - "127.0.0.1:8083:8083"
    mem_limit: 768m

  payment-service:
    <<: *hardened
    build:
      <<: *spring-build
      args: { SERVICE: payment-service, PORT: "8084" }
    image: ghcr.io/boovesh985/rydex-payment-service:${RYDEX_TAG:-latest}
    depends_on: *spring-deps
    environment:
      <<: *spring-env
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local_pw}
      # mock by default; razorpay with test keys in infra/.env (docs/GUIDE.md, Razorpay)
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "127.0.0.1:8084:8084"
    mem_limit: 768m

  ai-service:
    <<: *hardened
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    image: ghcr.io/boovesh985/rydex-ai-service:${RYDEX_TAG:-latest}
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "127.0.0.1:8085:8085"
    mem_limit: 512m

  caddy:
    <<: *hardened
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    image: ghcr.io/boovesh985/rydex-caddy:${RYDEX_TAG:-latest}
    depends_on: [ride-service, driver-service, tracking-service, payment-service]
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    mem_limit: 128m

  simulator:
    <<: *hardened
    profiles: [city]
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    image: ghcr.io/boovesh985/rydex-simulator:${RYDEX_TAG:-latest}
    depends_on:
      caddy:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    environment:
      RYDEX_API: http://caddy
    # every simulated driver goes offline before it exits
    stop_grace_period: 30s
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
  kafkadata:
  caddydata:
  caddyconfig:
